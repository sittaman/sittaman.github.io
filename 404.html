<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Página não encontrada — Felipe Sitta</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/assets/css/styles.css?v=7">
<style>
  .notfound { padding-block: clamp(3rem, 10vw, 7rem); }
  .notfound .code {
    font-size: var(--step-4); font-weight: 700; letter-spacing: -0.03em;
    background: linear-gradient(to right, var(--accent), var(--secondary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @media (forced-colors: active) { .notfound .code { color: CanvasText; -webkit-text-fill-color: CanvasText; } }
  .notfound h1 { margin-top: var(--space-3); font-size: var(--step-3); }
  .notfound .message { margin-top: var(--space-4); color: var(--muted); }
  .notfound .actions { margin-top: var(--space-5); }
</style>
</head>
<body>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="Felipe Sitta — início"><span class="brand-mark" aria-hidden="true">&gt;_</span></a>

    <!-- Root-absolute, unlike the rest of the site: a 404 answers an unknown path at any depth,
         so ../ would resolve against a directory that need not exist. The labels carry both
         languages inline because this page loads no i18n script. -->
    <nav class="site-nav" aria-label="Seções / Sections">
      <ul role="list">
        <li><a href="/#about">Sobre <span lang="en">/ About</span></a></li>
        <li><a href="/#skills">Skills</a></li>
        <li><a href="/#experience">Experiência <span lang="en">/ Experience</span></a></li>
        <li><a href="/#projects">Projetos <span lang="en">/ Projects</span></a></li>
        <li><a href="/#contact">Contato <span lang="en">/ Contact</span></a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main" class="notfound">
  <div class="shell">
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p class="prose message">
      O endereço acessado não existe neste site.
      <span lang="en">The page you were looking for is not here.</span>
    </p>
    <p class="actions">
      <a class="btn btn-primary" href="/">Voltar ao início <span lang="en">/ Back home</span></a>
    </p>
  </div>
</main>
</body>
</html>
